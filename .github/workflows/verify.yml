name: Property database verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python research.py
      - name: Dashboard smoke test
        run: python -c "from streamlit.testing.v1 import AppTest; a=AppTest.from_file('app.py').run(timeout=60); assert not a.exception; assert len(a.tabs)==4"
      - uses: actions/upload-artifact@v4
        with:
          name: property-database-review-packet
          path: outputs/demo/
